<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载地址 - 桌面宠物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }

  .back {
    position: fixed;
    top: 24px;
    left: 24px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.2s;
  }
  .back:hover { color: #fff; }

  .page-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .page-sub {
    font-size: 14px;
    color: #555;
    margin-bottom: 40px;
  }

  .dl-list {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .dl-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #141418;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 18px 20px;
    border-radius: 14px;
    color: #e8e8e8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .dl-item:hover {
    background: #1e1e24;
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }

  .dl-item.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .dl-item.disabled:hover {
    transform: none;
    background: #141418;
    border-color: rgba(255,255,255,0.08);
  }

  .dl-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0;
  }

  .dl-icon.baidu   { background: #3385ff; }
  .dl-icon.quark  { background: #0a8aff; }
  .dl-icon.xunlei { background: #f0c419; color: #1a1a1a; }
  .dl-icon.local   { background: linear-gradient(135deg, #ff8c42, #ff6b1a); }

  .dl-text { flex: 1; }
  .dl-name { font-size: 15px; font-weight: 600; }
  .dl-sub  { font-size: 12px; color: #666; margin-top: 3px; }
  .dl-arrow { color: #444; font-size: 18px; }

  .note {
    margin-top: 32px;
    font-size: 12px;
    color: #444;
    text-align: center;
    max-width: 360px;
    line-height: 1.7;
  }

  @media (max-width: 480px) {
    body { padding: 80px 16px 60px; }
    .page-title { font-size: 24px; }
    .dl-item { padding: 14px 16px; }
  }
</style>
</head>
<body>

  <a class="back" href="/">← 返回首页</a>

  <div class="page-title">下载地址</div>
  <div class="page-sub">选择任意方式下载桌面宠物</div>

  <div class="dl-list">
    <a class="dl-item" href="#">
      <div class="dl-icon baidu">百度</div>
      <div class="dl-text">
        <div class="dl-name">百度网盘</div>
        <div class="dl-sub">提取码：待补充</div>
      </div>
      <div class="dl-arrow">→</div>
    </a>

    <a class="dl-item" href="#">
      <div class="dl-icon quark">夸克</div>
      <div class="dl-text">
        <div class="dl-name">夸克网盘</div>
        <div class="dl-sub">提取码：待补充</div>
      </div>
      <div class="dl-arrow">→</div>
    </a>

    <a class="dl-item" href="#">
      <div class="dl-icon xunlei">迅雷</div>
      <div class="dl-text">
        <div class="dl-name">迅雷网盘</div>
        <div class="dl-sub">待补充</div>
      </div>
      <div class="dl-arrow">→</div>
    </a>

    <a class="dl-item disabled" href="#">
      <div class="dl-icon local">EXE</div>
      <div class="dl-text">
        <div class="dl-name">本地下载</div>
        <div class="dl-sub">打包中，稍后开放</div>
      </div>
      <div class="dl-arrow">→</div>
    </a>
  </div>

  <div class="note">
    若链接失效或无法下载<br>
    请前往 GitHub Release 页面获取最新版本
  </div>

</body>
</html>
