<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桌面宠物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    min-height: 100vh;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    border: 2px solid rgba(255,255,255,0.1);
  }

  .name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .bio {
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
    text-align: center;
  }

  .version {
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .tags {
    display: flex;
    gap: 8px;
    margin-bottom: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .tag {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .links {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #141418;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 16px 20px;
    border-radius: 14px;
    color: #e8e8e8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  .link-btn:hover {
    background: #1e1e24;
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }

  .link-btn.btn-click {
    cursor: pointer;
  }

  .link-icon {
    width: 22px;
    height: 22px;
    opacity: 0.7;
    flex-shrink: 0;
  }

  .link-text { flex: 1; }
  .link-arrow { opacity: 0.3; font-size: 14px; }

  /* Download modal — 4 列表 */
  .dl-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dl-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0a0a0f;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 14px 18px;
    border-radius: 12px;
    color: #e8e8e8;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .dl-item:hover {
    background: #1e1e24;
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }

  .dl-item.disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .dl-item.disabled:hover {
    transform: none;
    background: #0a0a0f;
    border-color: rgba(255,255,255,0.08);
  }

  .dl-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }

  .dl-icon.baidu  { background: #3385ff; }
  .dl-icon.quark  { background: #0a8aff; }
  .dl-icon.xunlei { background: #f0c419; color: #1a1a1a; }
  .dl-icon.local  { background: linear-gradient(135deg, #ff8c42, #ff6b1a); }

  .dl-text { flex: 1; }
  .dl-sub { font-size: 11px; color: #666; margin-top: 2px; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal {
    background: #141418;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    width: 100%;
    max-width: 540px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
  }

  .modal-close {
    background: none;
    border: none;
    color: #666;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.2s;
  }

  .modal-close:hover {
    color: #fff;
  }

  .changelog-item {
    margin-bottom: 22px;
  }

  .changelog-item:last-child {
    margin-bottom: 0;
  }

  .changelog-version {
    font-size: 14px;
    font-weight: 700;
    color: #ff8c42;
    margin-bottom: 6px;
  }

  .changelog-list {
    list-style: none;
    padding-left: 0;
  }

  .changelog-list li {
    font-size: 13px;
    color: #999;
    padding: 4px 0;
    padding-left: 16px;
    position: relative;
    line-height: 1.6;
  }

  .changelog-list li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #444;
  }

  @media (max-width: 480px) {
    body { padding: 48px 16px; }
    .name { font-size: 20px; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

  <img class="avatar" src="assets/app_icon.png" alt="桌面宠物" onerror="this.onerror=null;this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=pet&backgroundColor=1a1a2e';">
  <div class="name">桌面宠物</div>
  <div class="bio">让可爱的小宠物陪你度过每一个工作日</div>
  <div class="version">v1.0.3</div>
  <div class="tags">
    <span class="tag">Windows</span>
    <span class="tag">Python</span>
    <span class="tag">开源</span>
    <span class="tag">轻量</span>
  </div>

  <div class="links">
    <a class="link-btn" href="/download">
      <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span class="link-text">下载地址</span>
      <span class="link-arrow">→</span>
    </a>
    <a class="link-btn" href="javascript:void(0);" id="changelogBtn">
      <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span class="link-text">更新日志</span>
      <span class="link-arrow">→</span>
    </a>
    <a class="link-btn" href="#">
      <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span class="link-text">联系作者</span>
      <span class="link-arrow">→</span>
    </a>
  </div>


  <!-- Changelog Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">更新日志</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div id="changelogContent"></div>
    </div>
  </div>

  <script>
    const changelog = [
      {
        version: "v1.0.3",
        date: "",
        changes: [
          "新增软件图标与托盘图标"
        ]
      },
      {
        version: "v1.0.2",
        date: "",
        changes: [
          "修复右键菜单重复项"
        ]
      },
      {
        version: "v1.0.1",
        date: "",
        changes: [
          "修复浅色模式下文字颜色异常"
        ]
      },
      {
        version: "v1.0.0",
        date: "",
        changes: [
          "新增微软风格右键菜单",
          "新增设置窗口（走动/停止、跟随、暂停、点击穿透等）",
          "新增明暗主题切换，跟随系统主题"
        ]
      },
      {
        version: "v0.9.0",
        date: "",
        changes: [
          "更换眼镜样式"
        ]
      },
      {
        version: "v0.8.0",
        date: "",
        changes: [
          "跟随模式下宠物追到目标后停止移动",
          "跟随时近距自动减速",
          "新增左键拖拽宠物",
          "拖拽时禁用跟随移动",
          "喂饭按钮在走动/拖拽时禁用"
        ]
      },
      {
        version: "v0.7.0",
        date: "",
        changes: [
          "修复动画帧重复问题",
          "修复窗口尺寸变化后动画不更新"
        ]
      },
      {
        version: "v0.6.0",
        date: "",
        changes: [
          "新增双显示器支持，宠物可在多屏间自由移动"
        ]
      },
      {
        version: "v0.5.0",
        date: "",
        changes: [
          "新增跟随鼠标模式，多宠物在光标周围环形排列"
        ]
      },
      {
        version: "v0.4.0",
        date: "",
        changes: [
          "修复聚拢/分散按钮失效",
          "宠物静止时自动慢速游走",
          "头发缩短",
          "修复走到边缘前就转身的问题"
        ]
      },
      {
        version: "v0.3.0",
        date: "",
        changes: [
          "识别窗口边缘为障碍物"
        ]
      },
      {
        version: "v0.2.0",
        date: "",
        changes: [
          "修复走路动画抽搐问题"
        ]
      },
      {
        version: "v0.1.0",
        date: "",
        changes: [
          "写实人像桌面宠物登场"
        ]
      },
      {
        version: "v0.0.0",
        date: "",
        changes: [
          "初版发布"
        ]
      }
    ];

    const content = document.getElementById('changelogContent');
    content.innerHTML = changelog.map(item => `
      <div class="changelog-item">
        <div class="changelog-version">${item.version}</div>
        <ul class="changelog-list">
          ${item.changes.map(c => `<li>${c}</li>`).join('')}
        </ul>
      </div>
    `).join('');

    const overlay = document.getElementById('modalOverlay');
    const btn = document.getElementById('changelogBtn');
    const closeBtn = document.getElementById('modalClose');

    btn.addEventListener('click', () => overlay.classList.add('active'));
    closeBtn.addEventListener('click', () => overlay.classList.remove('active'));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  </script>

</body>
</html>
